name: Build NuGet package

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build all five runtime targets
        shell: bash
        run: |
          for rid in win-x64 win-arm64 osx-arm64 linux-x64 linux-arm64; do
            dotnet build NDILibDotNetAdvanced.csproj --configuration Release \
              --runtime "$rid" --no-self-contained -p:ContinuousIntegrationBuild=true
          done

      - name: Verify the managed SDK contract and layouts
        run: dotnet run --project tests/AbiLayout/AbiLayout.csproj --configuration Release

      - name: Configure the native finder fixture
        run: cmake -S tests/FinderFixture -B "${{ runner.temp }}/ndi-finder"

      - name: Build the native finder fixture
        run: cmake --build "${{ runner.temp }}/ndi-finder" --config Release

      - name: Test discovery updates and allocations
        run: ctest --test-dir "${{ runner.temp }}/ndi-finder" -C Release --output-on-failure

  package:
    name: Create package
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NDILibDotNetAdvanced.csproj

      - name: Determine package version
        id: version
        shell: bash
        run: |
          base_version="$(dotnet msbuild NDILibDotNetAdvanced.csproj -nologo -getProperty:VersionPrefix)"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            package_version="${GITHUB_REF_NAME#v}"
            if [[ "${package_version}" != "${base_version}" ]]; then
              echo "Tag version ${package_version} does not match VersionPrefix ${base_version}." >&2
              exit 1
            fi
          else
            package_version="${base_version}-ci.${GITHUB_RUN_NUMBER}"
          fi

          echo "package-version=${package_version}" >> "${GITHUB_OUTPUT}"

      - name: Pack
        run: >-
          dotnet pack NDILibDotNetAdvanced.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:ContinuousIntegrationBuild=true
          -p:PackageVersion=${{ steps.version.outputs.package-version }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish package to NuGet.org
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.100

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: nuget
          path: artifacts

      - name: Sign in to NuGet.org with Trusted Publishing
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: eliaspuurunen

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
